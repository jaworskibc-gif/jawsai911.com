<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JAWSAI911 Dashboard</title>
<script src="../hub-auth.js"></script>
<style>
  :root {
    --navy:#010711; --navy-2:#0B1F33; --cyan:#00B4FF; --teal:#00C4B4; --pink:#E8175D; --amber:#F2C879;
    --ink:#1a2230; --ink-soft:#5A6472; --foam:#F7FAFB; --line:#E2E6EA;
  }
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Liberation Sans', Arial, sans-serif; }
  body { background:var(--foam); color:var(--ink); }
  .topbar { background:var(--navy); color:#fff; padding:14px 22px; display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; }
  .brand { font-size:15px; font-weight:900; }
  .brand span { color:var(--cyan); }
  .picker select { background:var(--navy-2); color:#fff; border:1px solid rgba(255,255,255,.15); padding:7px 10px; border-radius:5px; font-size:12.5px; min-width:160px; }
  .banner { background:#EAF6FF; color:#0A5A80; font-size:11.5px; padding:8px 22px; border-bottom:1px solid #C8E8F7; }
  .wrap { max-width:1080px; margin:0 auto; padding:22px; }
  .status-msg { font-size:11px; color:var(--ink-soft); margin-bottom:18px; }
  .kpi-row { display:grid; grid-template-columns:repeat(4, 1fr); gap:14px; margin-bottom:20px; }
  .kpi-card { background:#fff; border:1px solid var(--line); border-radius:10px; padding:16px; }
  .kpi-num { font-size:26px; font-weight:900; color:var(--navy); }
  .kpi-label { font-size:10.5px; color:var(--ink-soft); letter-spacing:.4px; margin-top:3px; }
  .kpi-card.alert .kpi-num { color:var(--pink); }
  .grid2 { display:grid; grid-template-columns:1.2fr 1fr; gap:16px; margin-bottom:16px; }
  .section-card { background:#fff; border:1px solid var(--line); border-radius:10px; padding:18px; }
  .section-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }
  .section-title { font-size:13px; font-weight:800; color:var(--navy); }
  .section-link { font-size:11px; color:var(--ink-soft); }
  .funnel-row { display:flex; align-items:center; gap:10px; margin-bottom:8px; }
  .funnel-label { width:120px; font-size:11.5px; color:var(--ink-soft); flex-shrink:0; }
  .funnel-bar-track { flex:1; background:var(--foam); border-radius:4px; height:18px; overflow:hidden; }
  .funnel-bar-fill { height:100%; background:linear-gradient(90deg, var(--cyan), var(--teal)); border-radius:4px; }
  .funnel-count { width:28px; text-align:right; font-size:12px; font-weight:800; color:var(--navy); }
  .mini-list { list-style:none; }
  .mini-list li { display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:1px solid var(--line); font-size:12.5px; gap:12px; }
  .mini-list li:last-child { border-bottom:none; }
  .mini-name { font-weight:700; color:var(--ink); }
  .mini-meta { color:var(--ink-soft); font-size:11px; }
  .tag { font-size:10px; font-weight:800; padding:2px 8px; border-radius:8px; }
  .tag-overdue { background:var(--pink); color:#fff; }
  .tag-today { background:var(--amber); color:var(--navy); }
  .tag-sent { background:#EAF6FF; color:var(--cyan); }
  .tag-paid { background:#E6F9F1; color:#1FA37A; }
  .empty-mini { color:var(--ink-soft); font-size:12px; padding:10px 0; text-align:center; }
  .empty-state { text-align:center; padding:60px 20px; color:var(--ink-soft); font-size:13px; }
  @media (max-width:900px) { .kpi-row, .grid2 { grid-template-columns:1fr; } }
</style>
</head>
<body>
  <div class="topbar">
    <div class="brand">JAWS<span>AI</span>911 <span style="font-weight:400;">Client Dashboard</span></div>
    <div class="picker">
      <select id="clientSelect" onchange="onClientChange()"></select>
    </div>
  </div>
  <div class="banner">Pulls live data from `crm_leads`, `crm_calls`, `crm_tasks`, and invoices so sales sees the same records the caller is actively working.</div>

  <div class="wrap">
    <div class="status-msg" id="statusMsg">Loading...</div>
    <div id="dashboardContent"></div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="crm-shared.js"></script>
<script>
const SUPABASE_URL = 'https://owkqfledeuetwwmlvnmb.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im93a3FmbGVkZXVldHd3bWx2bm1iIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUxMzM5MTQsImV4cCI6MjEwMDcwOTkxNH0.lOwjIzs-DyVtvKR8-b1L6RTdlb8iY9_1chgKbY2ml3c';
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const STAGES = [
  { id:'new', name:'New Lead' },
  { id:'contacted', name:'Contacted' },
  { id:'warm', name:'Warm' },
  { id:'booked', name:'Booked' },
  { id:'showed', name:'Showed' },
  { id:'closed_won', name:'Closed Won' },
  { id:'closed_lost', name:'Closed Lost' },
  { id:'nurture', name:'Nurture' }
];
const CALL_OUTCOMES = {
  no_answer:'No Answer', voicemail:'Voicemail', spoke:'Spoke', scheduled:'Scheduled', not_interested:'Not Interested', won:'Won'
};

let currentClient = null;
let currentClientId = null;

function statusMsg(t) { document.getElementById('statusMsg').textContent = t; }
function escapeHtml(str) { const d = document.createElement('div'); d.textContent = str || ''; return d.innerHTML; }
function todayStr() { return new Date().toISOString().slice(0, 10); }
function fmtMoney(n) { return '$' + (isNaN(n) ? 0 : n).toFixed(2); }

async function loadClientList() {
  const { data, error } = await supabaseClient.from('clients').select('id, name').order('name');
  if (error) throw error;
  const select = document.getElementById('clientSelect');
  select.innerHTML = '';
  if (!data || data.length === 0) {
    select.innerHTML = '<option value="">No clients yet</option>';
    document.getElementById('dashboardContent').innerHTML = '<div class="empty-state">No client data yet. Add a client in the toolkit first.</div>';
    return;
  }
  data.forEach(client => {
    const opt = document.createElement('option');
    opt.value = client.id;
    opt.textContent = client.name;
    select.appendChild(opt);
  });
  const selected = data.find(client => client.id === currentClientId) || data[0];
  currentClientId = selected.id;
  currentClient = selected.name;
  select.value = currentClientId;
  await renderDashboard();
}

function onClientChange() {
  const select = document.getElementById('clientSelect');
  const option = select.selectedOptions[0];
  currentClientId = select.value || null;
  currentClient = option ? option.textContent : null;
  renderDashboard();
}

async function renderDashboard() {
  if (!currentClientId) return;
  statusMsg('Live snapshot for ' + currentClient + '.');
  try {
    const [leads, tasks, outstandingInvoicesRes, recentInvoicesRes] = await Promise.all([
      window.JAWSCRM.listCrmLeads(supabaseClient, currentClientId),
      window.JAWSCRM.getCrmTasks(supabaseClient, currentClientId, { status: 'open' }),
      supabaseClient.from('invoices').select('total, status').eq('client_id', currentClientId).neq('status', 'paid'),
      supabaseClient.from('invoices').select('customer_name, number, type, total, status').eq('client_id', currentClientId).order('updated_at', { ascending: false }).limit(5)
    ]);
    if (outstandingInvoicesRes.error || recentInvoicesRes.error) throw (outstandingInvoicesRes.error || recentInvoicesRes.error);

    const leadIds = (leads || []).map(lead => lead.id).filter(Boolean);
    let recentCalls = [];
    let totalCalls = 0;
    if (leadIds.length) {
      const [{ data: callRows, error: callError }, { count, error: callCountError }] = await Promise.all([
        supabaseClient.from('crm_calls').select('*, crm_leads!inner(full_name, phone, client_id)').in('lead_id', leadIds).order('called_at', { ascending: false }).limit(5),
        supabaseClient.from('crm_calls').select('*', { count: 'exact', head: true }).in('lead_id', leadIds)
      ]);
      if (callError || callCountError) throw (callError || callCountError);
      recentCalls = callRows || [];
      totalCalls = count || 0;
    }

    const pipeline = {};
    (leads || []).forEach(row => {
      if (!pipeline[row.status]) pipeline[row.status] = [];
      pipeline[row.status].push(row);
    });
    STAGES.forEach(stage => { if (!pipeline[stage.id]) pipeline[stage.id] = []; });

    const today = todayStr();
    const totalLeads = Object.values(pipeline).reduce((sum, arr) => sum + (arr ? arr.length : 0), 0);
    const wonCount = (pipeline.closed_won || []).length;
    const dueCount = (tasks || []).filter(t => t.due_at && t.due_at.slice(0, 10) <= today).length;
    const outstandingInvoices = (outstandingInvoicesRes.data || []).reduce((sum, i) => sum + (i.total || 0), 0);

    let html = `<div class="kpi-row">
      <div class="kpi-card"><div class="kpi-num">${totalLeads}</div><div class="kpi-label">TOTAL LEADS IN CRM</div></div>
      <div class="kpi-card"><div class="kpi-num">${wonCount}</div><div class="kpi-label">CLOSED WON</div></div>
      <div class="kpi-card ${dueCount > 0 ? 'alert' : ''}"><div class="kpi-num">${dueCount}</div><div class="kpi-label">FOLLOW-UPS DUE</div></div>
      <div class="kpi-card"><div class="kpi-num">${totalCalls}</div><div class="kpi-label">CALLS LOGGED</div></div>
    </div>`;
    html += `<div class="kpi-row" style="grid-template-columns:1fr;">
      <div class="kpi-card"><div class="kpi-num">${fmtMoney(outstandingInvoices)}</div><div class="kpi-label">OUTSTANDING INVOICES</div></div>
    </div>`;

    const maxCount = Math.max(1, ...STAGES.map(s => (pipeline[s.id] || []).length));
    const funnelHtml = STAGES.map(s => {
      const count = (pipeline[s.id] || []).length;
      const pct = Math.round((count / maxCount) * 100);
      return `<div class="funnel-row">
        <div class="funnel-label">${s.name}</div>
        <div class="funnel-bar-track"><div class="funnel-bar-fill" style="width:${pct}%"></div></div>
        <div class="funnel-count">${count}</div>
      </div>`;
    }).join('');

    const callsHtml = recentCalls.length === 0 ? '<div class="empty-mini">No calls logged yet.</div>' :
      '<ul class="mini-list">' + recentCalls.map(c => `<li><div><div class="mini-name">${escapeHtml(c.crm_leads?.full_name || 'Unknown Lead')}</div><div class="mini-meta">${escapeHtml(c.crm_leads?.phone || '')}</div></div><span class="mini-meta">${CALL_OUTCOMES[c.outcome] || c.outcome}</span></li>`).join('') + '</ul>';

    const followupsHtml = (tasks || []).length === 0 ? '<div class="empty-mini">No follow-ups scheduled.</div>' :
      '<ul class="mini-list">' + (tasks || []).map(t => {
        const dueDate = t.due_at ? t.due_at.slice(0, 10) : '';
        let tagClass = 'tag-sent', tagLabel = dueDate || 'OPEN';
        if (dueDate && dueDate < today) { tagClass = 'tag-overdue'; tagLabel = 'OVERDUE'; }
        else if (dueDate === today) { tagClass = 'tag-today'; tagLabel = 'TODAY'; }
        return `<li><div><div class="mini-name">${escapeHtml(t.crm_leads?.full_name || '')}</div><div class="mini-meta">${escapeHtml(t.title || t.task_type || 'Follow-up')}</div></div><span class="tag ${tagClass}">${tagLabel}</span></li>`;
      }).join('') + '</ul>';

    const invoicesHtml = (recentInvoicesRes.data || []).length === 0 ? '<div class="empty-mini">No estimates or invoices yet.</div>' :
      '<ul class="mini-list">' + (recentInvoicesRes.data || []).map(i => `<li><div><div class="mini-name">${escapeHtml(i.customer_name)}</div><div class="mini-meta">${escapeHtml(i.number)} · ${i.type}</div></div><div style="text-align:right;"><div class="mini-name">${fmtMoney(i.total)}</div><span class="tag tag-${i.status}">${i.status.toUpperCase()}</span></div></li>`).join('') + '</ul>';

    const tasksHtml = (tasks || []).length === 0 ? '<div class="empty-mini">No CRM tasks pending.</div>' :
      '<ul class="mini-list">' + (tasks || []).map(t => {
        const dueDate = t.due_at ? t.due_at.slice(0, 10) : '';
        let tagClass = 'tag-sent', tagLabel = dueDate || 'OPEN';
        if (dueDate && dueDate < today) { tagClass = 'tag-overdue'; tagLabel = 'OVERDUE'; }
        else if (dueDate === today) { tagClass = 'tag-today'; tagLabel = 'TODAY'; }
        return `<li><div><div class="mini-name">${escapeHtml(t.crm_leads?.full_name || '')}</div><div class="mini-meta">${escapeHtml(t.title || t.task_type || 'Task')}</div></div><span class="tag ${tagClass}">${tagLabel}</span></li>`;
      }).join('') + '</ul>';

    html += `<div class="grid2">
      <div class="section-card"><div class="section-head"><div class="section-title">Pipeline Funnel</div><div class="section-link">Open Pipeline tool →</div></div>${funnelHtml}</div>
      <div class="section-card"><div class="section-head"><div class="section-title">Follow-Ups Due</div><div class="section-link">Open Sales Console →</div></div>${followupsHtml}</div>
    </div>`;
    html += `<div class="grid2">
      <div class="section-card"><div class="section-head"><div class="section-title">Recent Calls</div><div class="section-link">Open Call Tracker →</div></div>${callsHtml}</div>
      <div class="section-card"><div class="section-head"><div class="section-title">Recent Invoices</div><div class="section-link">Open Invoicing →</div></div>${invoicesHtml}</div>
    </div>`;
    html += `<div class="section-card"><div class="section-head"><div class="section-title">Pending CRM Tasks</div><div class="section-link">Open Workflow Builder →</div></div>${tasksHtml}</div>`;
    document.getElementById('dashboardContent').innerHTML = html;
  } catch (error) {
    statusMsg(error.message);
  }
}

loadClientList();
</script>
</body>
</html>
