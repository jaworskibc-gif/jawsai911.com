<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JAWSAI911 Call Tracker</title>
<script src="../hub-auth.js"></script>
<style>
  :root {
    --navy: #010711; --navy-2: #0B1F33;
    --cyan: #00B4FF; --teal: #00C4B4; --pink: #E8175D; --amber: #F2C879;
    --ink: #1a2230; --ink-soft: #5A6472; --foam: #F7FAFB; --line: #E2E6EA;
  }
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Liberation Sans', Arial, sans-serif; }
  body { background: var(--foam); color: var(--ink); }

  .topbar {
    background: var(--navy); color: white; padding: 14px 22px;
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px;
  }
  .brand { font-size: 15px; font-weight: 900; }
  .brand span { color: var(--cyan); }
  .picker { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .picker select, .picker input {
    background: var(--navy-2); color: white; border: 1px solid rgba(255,255,255,0.15);
    padding: 7px 10px; border-radius: 5px; font-size: 12.5px;
  }
  .picker button {
    background: var(--teal); color: var(--navy); border: none; font-weight: 800;
    padding: 7px 12px; border-radius: 5px; font-size: 12px; cursor: pointer;
  }

  .tabs { display: flex; gap: 4px; padding: 14px 22px 0 22px; border-bottom: 1px solid var(--line); background: white; align-items: center; }
  .tab { padding: 10px 16px; font-size: 12.5px; font-weight: 800; color: var(--ink-soft); cursor: pointer; border-bottom: 3px solid transparent; position: relative; }
  .tab.active { color: var(--navy); border-bottom-color: var(--teal); }
  .tab-count {
    background: var(--pink); color: white; font-size: 9.5px; font-weight: 800;
    padding: 1px 6px; border-radius: 8px; margin-left: 5px;
  }
  .panel { display:none; padding: 22px; max-width: 900px; margin: 0 auto; }
  .panel.active { display:block; }
  .status-msg { font-size: 11px; color: var(--ink-soft); margin-bottom: 16px; }

  .btn { padding: 8px 14px; border-radius: 5px; border: none; font-weight: 800; font-size: 12.5px; cursor: pointer; }
  .btn-teal { background: var(--teal); color: var(--navy); }
  .btn-outline { background: white; border: 1px solid var(--line) !important; color: var(--ink-soft); }

  /* ---- LOG FORM ---- */
  .form-card { background: white; border: 1px solid var(--line); border-radius: 10px; padding: 22px; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 14px; }
  .row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; margin-bottom: 14px; }
  .field label { font-size: 11px; font-weight: 700; color: var(--ink-soft); display:block; margin-bottom: 4px; }
  .field input, .field select, .field textarea {
    width: 100%; padding: 9px 11px; border: 1px solid var(--line); border-radius: 6px; font-size: 13px;
  }

  .outcome-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 14px; }
  .outcome-btn {
    padding: 10px 8px; text-align: center; border: 1.5px solid var(--line); border-radius: 6px;
    font-weight: 800; font-size: 11.5px; cursor: pointer; color: var(--ink-soft); background: white;
  }
  .outcome-btn.selected { border-color: var(--teal); background: #E6F9F5; color: var(--navy); }

  /* ---- TABLES ---- */
  .call-table { width: 100%; border-collapse: collapse; background: white; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .call-table th { background: var(--navy-2); color: white; font-size: 11px; text-align:left; padding: 9px 12px; }
  .call-table td { padding: 10px 12px; font-size: 12.5px; border-top: 1px solid var(--line); vertical-align: top; }
  .badge { padding: 3px 9px; border-radius: 10px; font-size: 10px; font-weight: 800; white-space: nowrap; }
  .badge-no_answer { background: #EDEFF2; color: var(--ink-soft); }
  .badge-voicemail { background: #FFF4E0; color: #B8791A; }
  .badge-spoke { background: #EAF6FF; color: var(--cyan); }
  .badge-scheduled { background: #E6F9F1; color: #1FA37A; }
  .badge-not_interested { background: #FCEAF0; color: var(--pink); }
  .badge-won { background: var(--navy); color: var(--teal); }
  .followup-tag { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 8px; }
  .followup-overdue { background: var(--pink); color: white; }
  .followup-today { background: var(--amber); color: var(--navy); }
  .followup-future { background: var(--foam); color: var(--ink-soft); }
  .empty-state { text-align: center; padding: 40px 20px; color: var(--ink-soft); font-size: 13px; }
  .filter-row { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
  .filter-row select { padding: 7px 10px; border: 1px solid var(--line); border-radius: 5px; font-size: 12px; }
</style>
</head>
<body>

  <div class="topbar">
    <div class="brand">JAWS<span>AI</span>911 <span style="font-weight:400;">Call Tracker</span></div>
    <div class="picker">
      <select id="clientSelect"></select>
      <input id="newClientName" placeholder="New client name...">
      <button onclick="createClient()">+ Add Client</button>
    </div>
  </div>

  <div class="tabs">
    <div class="tab active" data-tab="log" onclick="switchTab('log')">Log Call</div>
    <div class="tab" data-tab="all" onclick="switchTab('all')">Call History</div>
    <div class="tab" data-tab="followups" onclick="switchTab('followups')">Follow-Ups Due <span class="tab-count" id="followupCount" style="display:none;">0</span></div>
  </div>

  <div class="panel active" id="panel-log">
    <div class="status-msg" id="statusMsg">Loading...</div>
    <div class="form-card">
      <div class="row3">
        <div class="field">
          <label>Existing Lead</label>
          <select id="existingLeadSelect">
            <option value="">Select from pipeline...</option>
          </select>
        </div>
        <div class="field"><label>Lead / Business Name</label><input id="leadName" placeholder="e.g. Coastal Blue Pool Care"></div>
        <div class="field"><label>Phone</label><input id="leadPhone" placeholder="(561) 555-0134"></div>
      </div>

      <label style="font-size:11px; font-weight:700; color:var(--ink-soft); display:block; margin-bottom:8px;">Call Outcome</label>
      <div class="outcome-grid" id="outcomeGrid"></div>

      <div class="row2">
        <div class="field"><label>Follow-Up Date (optional)</label><input id="followUpDate" type="date"></div>
        <div class="field"><label>Call Notes</label><input id="callNotes" placeholder="What happened on the call..."></div>
      </div>

      <button class="btn btn-teal" onclick="logCall()">Save Call</button>
    </div>
  </div>

  <div class="panel" id="panel-all">
    <div class="filter-row">
      <select id="outcomeFilter" onchange="renderAllCalls()">
        <option value="">All outcomes</option>
        <option value="no_answer">No Answer</option>
        <option value="voicemail">Voicemail</option>
        <option value="spoke">Spoke</option>
        <option value="scheduled">Scheduled</option>
        <option value="not_interested">Not Interested</option>
        <option value="won">Won</option>
      </select>
    </div>
    <div id="allCallsContainer"></div>
  </div>

  <div class="panel" id="panel-followups">
    <div id="followupsContainer"></div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="crm-shared.js"></script>
<script>
const SUPABASE_URL = 'https://owkqfledeuetwwmlvnmb.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im93a3FmbGVkZXVldHd3bWx2bm1iIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUxMzM5MTQsImV4cCI6MjEwMDcwOTkxNH0.lOwjIzs-DyVtvKR8-b1L6RTdlb8iY9_1chgKbY2ml3c';
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const OUTCOMES = [
  { id: 'no_answer', label: 'No Answer' },
  { id: 'voicemail', label: 'Left Voicemail' },
  { id: 'spoke', label: 'Spoke to Them' },
  { id: 'scheduled', label: 'Call Scheduled' },
  { id: 'not_interested', label: 'Not Interested' },
  { id: 'won', label: 'Won / Closed' },
];

let currentClient = null;
let currentClientId = null;
let selectedOutcome = 'no_answer';
let callsData = [];
let pipelineLeads = [];
let followupTasks = [];

function statusMsg(t) { document.getElementById('statusMsg').textContent = t; }
function escapeHtml(str) { const d = document.createElement('div'); d.textContent = str || ''; return d.innerHTML; }
function todayStr() { return new Date().toISOString().slice(0,10); }
function normalizeCall(row) {
  return {
    id: row.id,
    leadName: row.crm_leads?.full_name || row.full_name || '',
    phone: row.crm_leads?.phone || row.phone || '',
    outcome: row.outcome || 'no_answer',
    notes: row.notes || '',
    followUpDate: row.next_follow_up_at ? row.next_follow_up_at.slice(0, 10) : '',
    loggedAt: row.called_at || row.created_at || new Date().toISOString()
  };
}

function switchTab(name) {
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === name));
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.getElementById('panel-' + name).classList.add('active');
  if (name === 'all') renderAllCalls();
  if (name === 'followups') renderFollowups();
}

function renderLeadOptions() {
  const select = document.getElementById('existingLeadSelect');
  select.innerHTML = '<option value="">Select from pipeline...</option>';
  pipelineLeads.forEach(lead => {
    const opt = document.createElement('option');
    opt.value = lead.id;
    opt.textContent = (lead.full_name || lead.name || '') + (lead.phone ? ' — ' + lead.phone : '');
    select.appendChild(opt);
  });
}

function syncSelectedLead() {
  const select = document.getElementById('existingLeadSelect');
  const lead = pipelineLeads.find(row => row.id === select.value);
  if (!lead) return;
  document.getElementById('leadName').value = lead.full_name || lead.name || '';
  document.getElementById('leadPhone').value = lead.phone || '';
}

function renderOutcomeGrid() {
  const grid = document.getElementById('outcomeGrid');
  grid.innerHTML = '';
  OUTCOMES.forEach(o => {
    const btn = document.createElement('div');
    btn.className = 'outcome-btn' + (o.id === selectedOutcome ? ' selected' : '');
    btn.textContent = o.label;
    btn.onclick = () => { selectedOutcome = o.id; renderOutcomeGrid(); };
    grid.appendChild(btn);
  });
}

async function loadClientList() {
  try {
    const { data, error } = await supabaseClient.from('clients').select('id, name').order('name');
    if (error) throw error;
    const select = document.getElementById('clientSelect');
    select.innerHTML = '';
    if (!data || data.length === 0) {
      select.innerHTML = '<option value="">No clients yet</option>';
      currentClient = null;
      currentClientId = null;
      return;
    }
    data.forEach(client => {
      const opt = document.createElement('option');
      opt.value = client.id;
      opt.textContent = client.name;
      select.appendChild(opt);
    });
    const selected = data.find(client => client.id === currentClientId) || data[0];
    currentClientId = selected.id;
    currentClient = selected.name;
    select.value = currentClientId;
    await loadCalls();
  } catch (e) {
    statusMsg('No clients yet — add one to get started.');
  }
}

async function createClient() {
  const input = document.getElementById('newClientName');
  const name = input.value.trim();
  if (!name) return;
  const { data, error } = await supabaseClient.from('clients').insert({ name }).select('id, name').single();
  if (error) {
    alert(error.message);
    return;
  }
  input.value = '';
  currentClientId = data.id;
  currentClient = data.name;
  await loadClientList();
  await loadCalls();
}

document.getElementById('clientSelect').addEventListener('change', async (e) => {
  const option = e.target.selectedOptions[0];
  currentClientId = e.target.value || null;
  currentClient = option ? option.textContent : null;
  await loadCalls();
});

async function loadCalls() {
  if (!currentClientId) { callsData = []; pipelineLeads = []; followupTasks = []; updateFollowupBadge(); return; }
  statusMsg('Logging calls for ' + currentClient + ' — outcomes now update the CRM stage and create follow-up tasks automatically.');
  try {
    const leadsRes = await window.JAWSCRM.listCrmLeads(supabaseClient, currentClientId);
    const leadIds = (leadsRes || []).map(lead => lead.id).filter(Boolean);
    let callsRows = [];
    if (leadIds.length) {
      const { data, error } = await supabaseClient
        .from('crm_calls')
        .select('*, crm_leads!inner(full_name, phone, next_follow_up_at, client_id)')
        .in('lead_id', leadIds)
        .order('called_at', { ascending: false });
      if (error) throw error;
      callsRows = data || [];
    }
    callsData = callsRows.map(normalizeCall);
    pipelineLeads = leadsRes || [];
    const taskRows = await window.JAWSCRM.getCrmTasks(supabaseClient, currentClientId, { status: 'open' });
    followupTasks = (taskRows || []).map(row => ({
      leadName: row.crm_leads?.full_name || '',
      phone: row.crm_leads?.phone || '',
      type: row.task_type || 'task',
      script: row.title || '',
      dueDate: row.due_at ? row.due_at.slice(0, 10) : '',
      workflowName: 'CRM Task'
    }));
  } catch (e) {
    callsData = [];
    pipelineLeads = [];
    followupTasks = [];
  }
  renderLeadOptions();
  updateFollowupBadge();
}

async function logCall() {
  if (!currentClientId) { alert('Add a client first.'); return; }
  const leadName = document.getElementById('leadName').value.trim();
  if (!leadName) { alert('Enter a lead / business name first.'); return; }
  const phone = document.getElementById('leadPhone').value.trim();
  const notes = document.getElementById('callNotes').value.trim();
  const followUpDate = document.getElementById('followUpDate').value;

  try {
    const selectedLead = pipelineLeads.find(lead => lead.id === document.getElementById('existingLeadSelect').value);
    const result = await window.JAWSCRM.logCrmCall(supabaseClient, {
      clientId: currentClientId,
      leadId: selectedLead ? selectedLead.id : null,
      full_name: leadName,
      phone,
      notes,
      outcome: selectedOutcome,
      followUpAt: followUpDate ? followUpDate + 'T09:00:00.000Z' : null,
      called_by: 'call_tracker'
    });
    await loadCalls();
    document.getElementById('existingLeadSelect').value = '';
    document.getElementById('leadName').value = '';
    document.getElementById('leadPhone').value = '';
    document.getElementById('callNotes').value = '';
    document.getElementById('followUpDate').value = '';
    selectedOutcome = 'no_answer';
    renderOutcomeGrid();
    const taskText = result.task ? ' Auto follow-up activated.' : '';
    statusMsg('Logged and synced to CRM.' + taskText);
  } catch (e) {
    alert(e.message);
    return;
  }
}

function renderAllCalls() {
  const container = document.getElementById('allCallsContainer');
  const filter = document.getElementById('outcomeFilter').value;
  const filtered = filter ? callsData.filter(c => c.outcome === filter) : callsData;

  if (!currentClient || filtered.length === 0) {
    container.innerHTML = '<div class="empty-state">No calls logged yet' + (filter ? ' for this outcome.' : '.') + '</div>';
    return;
  }

  let html = '<table class="call-table"><thead><tr><th>Lead</th><th>Phone</th><th>Outcome</th><th>Follow-Up</th><th>Notes</th><th>Logged</th></tr></thead><tbody>';
  filtered.forEach(c => {
    const oc = OUTCOMES.find(o => o.id === c.outcome);
    html += `<tr>
      <td>${escapeHtml(c.leadName)}</td>
      <td>${escapeHtml(c.phone)}</td>
      <td><span class="badge badge-${c.outcome}">${oc ? oc.label : c.outcome}</span></td>
      <td>${c.followUpDate ? escapeHtml(c.followUpDate) : '—'}</td>
      <td>${escapeHtml(c.notes)}</td>
      <td>${new Date(c.loggedAt).toLocaleDateString()}</td>
    </tr>`;
  });
  html += '</tbody></table>';
  container.innerHTML = html;
}

function getDueFollowups() {
  const today = todayStr();
  return callsData.filter(c => c.followUpDate && c.followUpDate <= today);
}

function updateFollowupBadge() {
  const today = todayStr();
  const due = getDueFollowups().length + followupTasks.filter(t => t.dueDate && t.dueDate <= today).length;
  const badge = document.getElementById('followupCount');
  if (due > 0) {
    badge.style.display = 'inline-block';
    badge.textContent = due;
  } else {
    badge.style.display = 'none';
  }
}

function renderFollowups() {
  const container = document.getElementById('followupsContainer');
  const today = todayStr();
  const callFollowups = callsData
    .filter(c => c.followUpDate)
    .map(c => ({ kind: 'call', leadName: c.leadName, phone: c.phone, outcome: c.outcome, dueDate: c.followUpDate, notes: c.notes }));
  const taskFollowups = followupTasks.map(t => ({ kind: 'task', leadName: t.leadName, phone: '', outcome: t.type, dueDate: t.dueDate, notes: t.script }));
  const due = callFollowups.concat(taskFollowups).sort((a, b) => a.dueDate.localeCompare(b.dueDate));

  if (!currentClient || due.length === 0) {
    container.innerHTML = '<div class="empty-state">No follow-ups scheduled. Logging a call now creates automatic follow-up tasks where they make sense.</div>';
    return;
  }

  let html = '<table class="call-table"><thead><tr><th>Lead</th><th>Phone</th><th>Source</th><th>Follow-Up Date</th><th>Notes / Task</th></tr></thead><tbody>';
  due.forEach(c => {
    let tagClass = 'followup-future', tagLabel = c.followUpDate;
    if (c.followUpDate < today) { tagClass = 'followup-overdue'; tagLabel = 'OVERDUE — ' + c.followUpDate; }
    else if (c.followUpDate === today) { tagClass = 'followup-today'; tagLabel = 'TODAY'; }
    const oc = OUTCOMES.find(o => o.id === c.outcome);
    const sourceLabel = c.kind === 'task' ? 'Auto Follow-Up Task' : (oc ? oc.label : c.outcome);
    html += `<tr>
      <td>${escapeHtml(c.leadName)}</td>
      <td>${escapeHtml(c.phone || '—')}</td>
      <td>${escapeHtml(sourceLabel)}</td>
      <td><span class="followup-tag ${tagClass}">${escapeHtml(tagLabel)}</span></td>
      <td>${escapeHtml(c.notes)}</td>
    </tr>`;
  });
  html += '</tbody></table>';
  container.innerHTML = html;
}

renderOutcomeGrid();
document.getElementById('existingLeadSelect').addEventListener('change', syncSelectedLead);
loadClientList();
</script>
</body>
</html>
