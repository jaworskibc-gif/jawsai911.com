<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JAWSAI911 Customer Portal</title>
<style>
  :root {
    --navy:#010711; --navy-2:#0B1F33; --cyan:#00B4FF; --teal:#00C4B4;
    --ink:#1a2230; --ink-soft:#5A6472; --foam:#F7FAFB; --line:#E2E6EA;
  }
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Liberation Sans', Arial, sans-serif; }
  body { background:linear-gradient(180deg, #eef6fb 0%, #f7fafb 160px, #f7fafb 100%); color:var(--ink); }
  .shell { max-width:980px; margin:0 auto; padding:28px 22px 40px; }
  .header {
    background:var(--navy); color:#fff; border-radius:16px; padding:22px 24px; margin-bottom:18px;
    display:flex; justify-content:space-between; align-items:flex-start; gap:16px; flex-wrap:wrap;
  }
  .brand { font-size:22px; font-weight:900; }
  .brand span { color:var(--cyan); }
  .tagline { font-size:12px; color:rgba(255,255,255,.72); margin-top:6px; max-width:560px; line-height:1.5; }
  .header-actions { display:flex; gap:8px; flex-wrap:wrap; }
  .btn {
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    padding:10px 14px; border-radius:10px; border:1px solid transparent;
    text-decoration:none; cursor:pointer; font-size:12px; font-weight:800;
  }
  .btn.primary { background:var(--teal); color:var(--navy); }
  .btn.secondary { background:rgba(255,255,255,.08); color:#fff; border-color:rgba(255,255,255,.12); }
  .status { font-size:12px; color:var(--ink-soft); margin-bottom:14px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:16px; padding:26px; box-shadow:0 12px 34px rgba(1,7,17,.06); }
  .sheet-head { display:flex; justify-content:space-between; align-items:flex-start; gap:20px; margin-bottom:26px; flex-wrap:wrap; }
  .sheet-brand { font-size:24px; font-weight:900; color:var(--navy); }
  .sheet-brand span { color:var(--cyan); }
  .sheet-sub { font-size:11px; color:var(--ink-soft); margin-top:6px; line-height:1.6; }
  .doc-type { font-size:28px; font-weight:900; text-align:right; color:var(--cyan); }
  .doc-type.invoice { color:#E8175D; }
  .doc-type.proposal { color:#00B4FF; }
  .doc-type.estimate { color:#00C4B4; }
  .doc-meta { font-size:11px; color:var(--ink-soft); text-align:right; margin-top:6px; line-height:1.6; }
  .pill-row { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:24px; }
  .pill { border-radius:999px; padding:5px 10px; font-size:10px; font-weight:800; background:#eef6fb; color:#0A5A80; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:18px; margin-bottom:24px; }
  .block-label { font-size:10px; font-weight:800; color:var(--ink-soft); letter-spacing:.08em; margin-bottom:6px; }
  .block-value { font-size:14px; line-height:1.65; }
  .table { width:100%; border-collapse:collapse; margin-bottom:20px; }
  .table th { text-align:left; font-size:10.5px; color:var(--ink-soft); border-bottom:2px solid var(--navy); padding:7px 4px; }
  .table td { font-size:13px; padding:10px 4px; border-bottom:1px solid var(--line); }
  .num { text-align:right; }
  .totals { display:flex; justify-content:flex-end; margin-bottom:20px; }
  .totals-box { width:260px; }
  .totals-row { display:flex; justify-content:space-between; font-size:13px; padding:5px 0; color:var(--ink-soft); }
  .totals-row.grand { font-size:17px; font-weight:900; color:var(--navy); border-top:1px solid var(--line); margin-top:6px; padding-top:10px; }
  .notes {
    border-top:1px solid var(--line); padding-top:18px; font-size:12px; color:var(--ink-soft);
    line-height:1.8; white-space:pre-wrap;
  }
  .response-box {
    margin-top:18px; border-top:1px solid var(--line); padding-top:18px;
    display:grid; gap:10px;
  }
  .response-box h3 { font-size:13px; font-weight:900; color:var(--navy); }
  .response-box p { font-size:11.5px; color:var(--ink-soft); line-height:1.6; }
  .response-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .response-box input, .response-box textarea {
    width:100%; padding:10px; border:1px solid var(--line); border-radius:10px; font-size:12.5px;
  }
  .response-box textarea { min-height:96px; resize:vertical; }
  .response-actions { display:flex; gap:8px; flex-wrap:wrap; }
  .btn.outline { background:#fff; color:var(--ink); border-color:var(--line); }
  .response-history {
    background:#f7fafb; border:1px solid var(--line); border-radius:12px; padding:12px; font-size:11.5px;
    color:var(--ink-soft); line-height:1.7; white-space:pre-wrap;
  }
  .empty {
    padding:48px 24px; border:1px dashed var(--line); border-radius:16px;
    text-align:center; background:#fff; color:var(--ink-soft); font-size:13px;
  }
  @media (max-width: 760px) {
    .grid { grid-template-columns:1fr; }
    .doc-type, .doc-meta { text-align:left; }
    .response-grid { grid-template-columns:1fr; }
  }
  @media print {
    body { background:#fff; }
    .header, .status { display:none !important; }
    .shell { padding:0; max-width:none; }
    .card { border:none; border-radius:0; box-shadow:none; padding:0; }
  }
</style>
</head>
<body>
  <main class="shell">
    <section class="header">
      <div>
        <div class="brand">JAWS<span>AI</span>911 Customer Portal</div>
        <div class="tagline">View the current proposal, estimate, or invoice in one clean branded page. Use this link for review, approval, print, or save as PDF.</div>
      </div>
      <div class="header-actions">
        <button class="btn primary" type="button" onclick="window.print()">Print / Save PDF</button>
        <a class="btn secondary" id="builderLink" href="JAWSAI911_Invoicing.html">Open Builder</a>
      </div>
    </section>

    <div class="status" id="statusMsg">Loading...</div>
    <section id="portalBody"></section>
  </main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL = 'https://owkqfledeuetwwmlvnmb.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im93a3FmbGVkZXVldHd3bWx2bm1iIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUxMzM5MTQsImV4cCI6MjEwMDcwOTkxNH0.lOwjIzs-DyVtvKR8-b1L6RTdlb8iY9_1chgKbY2ml3c';
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const params = new URLSearchParams(window.location.search);
const invoiceId = params.get('invoice_id') || '';
let invoice = null;
let currentLeadId = null;
let portalEvents = [];

function statusMsg(text) { document.getElementById('statusMsg').textContent = text; }
function escapeHtml(value) { const div = document.createElement('div'); div.textContent = value || ''; return div.innerHTML; }
function fmtMoney(value) { return '$' + (isNaN(value) ? 0 : Number(value).toFixed(2)); }

function portalType(record) {
  if (!record) return 'Document';
  if ((record.notes || '').includes('[PROPOSAL]')) return 'Proposal';
  if (record.type === 'invoice') return 'Invoice';
  return 'Estimate';
}

function cleanNotes(notes) {
  return String(notes || '').replace(/^\[PROPOSAL\]\s*/i, '').trim();
}

function proposalResponseBlock(notes) {
  const match = String(notes || '').match(/\[PORTAL RESPONSE\][\s\S]*$/);
  return match ? match[0] : '';
}

function proposalBaseNotes(notes) {
  return cleanNotes(String(notes || '').replace(/\n?\[PORTAL RESPONSE\][\s\S]*$/m, '').trim());
}

function canRespondToProposal() {
  return portalType(invoice) === 'Proposal';
}

function renderPortalHistory() {
  if (!portalEvents.length) return '';
  const items = portalEvents.map(event => {
    const metaBits = [
      event.event_type ? String(event.event_type).replace(/_/g, ' ') : 'portal event',
      event.actor_name || 'Unknown',
      event.actor_title || '',
      event.created_at ? new Date(event.created_at).toLocaleString() : ''
    ].filter(Boolean);
    return '<div class="response-history">' + escapeHtml(metaBits.join(' · ') + (event.notes ? '\n' + event.notes : '')) + '</div>';
  }).join('');
  return '<div class="response-box"><h3>Portal Activity</h3><p>Recorded customer responses tied to this proposal.</p>' + items + '</div>';
}

function renderPortal() {
  const body = document.getElementById('portalBody');
  if (!invoice) {
    body.innerHTML = '<div class="empty">No document found for this link.</div>';
    return;
  }
  const typeLabel = portalType(invoice);
  const rows = (Array.isArray(invoice.line_items) ? invoice.line_items : []).map(item => {
    const qty = Number(item.qty || 0);
    const price = Number(item.price || 0);
    return '<tr><td>' + escapeHtml(item.desc || '') + '</td><td class="num">' + escapeHtml(String(qty)) + '</td><td class="num">' + fmtMoney(price) + '</td><td class="num">' + fmtMoney(qty * price) + '</td></tr>';
  }).join('');
  const taxPct = Number(invoice.tax_pct || 0);
  const subtotal = Number(invoice.subtotal || 0);
  const total = Number(invoice.total || 0);
  const cleaned = proposalBaseNotes(invoice.notes);
  const responseHistory = proposalResponseBlock(invoice.notes);
  const eventHistory = renderPortalHistory();
  const responseSection = canRespondToProposal() ? (
    '<div class="response-box">' +
      '<h3>Proposal Response</h3>' +
      '<p>Use this section to approve the proposal or request changes. This updates the same proposal record the sales team sees.</p>' +
      '<div class="response-grid">' +
        '<input id="signerName" placeholder="Your name">' +
        '<input id="signerTitle" placeholder="Title or company role">' +
      '</div>' +
      '<textarea id="responseNotes" placeholder="Optional approval notes, requested edits, timing, or questions."></textarea>' +
      '<div class="response-actions">' +
        '<button class="btn primary" type="button" onclick="updateProposalResponse(\'approved\')">Approve Proposal</button>' +
        '<button class="btn outline" type="button" onclick="updateProposalResponse(\'changes_requested\')">Request Changes</button>' +
      '</div>' +
      (responseHistory ? '<div class="response-history">' + escapeHtml(responseHistory) + '</div>' : '') +
    '</div>'
  ) : '';
  document.getElementById('builderLink').href = 'JAWSAI911_Invoicing.html?client_id=' + encodeURIComponent(invoice.client_id || '');
  body.innerHTML = '<article class="card">' +
    '<div class="sheet-head">' +
      '<div>' +
        '<div class="sheet-brand">JAWS<span>AI</span>911</div>' +
        '<div class="sheet-sub">Premium websites, CRM workflows, follow-up systems, and operator-ready delivery.</div>' +
      '</div>' +
      '<div>' +
        '<div class="doc-type ' + escapeHtml(String(typeLabel).toLowerCase()) + '">' + escapeHtml(typeLabel.toUpperCase()) + '</div>' +
        '<div class="doc-meta">' + escapeHtml(invoice.number || 'Draft') + '<br>' + escapeHtml(new Date(invoice.invoice_date || invoice.updated_at || Date.now()).toLocaleDateString()) + '</div>' +
      '</div>' +
    '</div>' +
    '<div class="pill-row">' +
      '<span class="pill">Status: ' + escapeHtml(invoice.status || 'draft') + '</span>' +
      '<span class="pill">Customer: ' + escapeHtml(invoice.customer_name || 'Customer') + '</span>' +
    '</div>' +
    '<div class="grid">' +
      '<div><div class="block-label">Prepared For</div><div class="block-value">' + escapeHtml(invoice.customer_name || 'Customer') + '</div></div>' +
      '<div><div class="block-label">Document Reference</div><div class="block-value">' + escapeHtml(invoice.number || 'Draft') + '</div></div>' +
    '</div>' +
    '<table class="table"><thead><tr><th>Description</th><th class="num">Qty</th><th class="num">Price</th><th class="num">Total</th></tr></thead><tbody>' + rows + '</tbody></table>' +
    '<div class="totals"><div class="totals-box">' +
      '<div class="totals-row"><span>Subtotal</span><span>' + fmtMoney(subtotal) + '</span></div>' +
      '<div class="totals-row"><span>Tax</span><span>' + escapeHtml(String(taxPct.toFixed(1))) + '%</span></div>' +
      '<div class="totals-row grand"><span>Total</span><span>' + fmtMoney(total) + '</span></div>' +
    '</div></div>' +
    '<div class="notes">' + escapeHtml(cleaned || 'No additional notes.') + '</div>' +
    responseSection +
    eventHistory +
  '</article>';
}

async function updateProposalResponse(nextStatus) {
  if (!invoice || !canRespondToProposal()) return;
  const signerName = (document.getElementById('signerName') || {}).value ? document.getElementById('signerName').value.trim() : '';
  const signerTitle = (document.getElementById('signerTitle') || {}).value ? document.getElementById('signerTitle').value.trim() : '';
  const responseNotes = (document.getElementById('responseNotes') || {}).value ? document.getElementById('responseNotes').value.trim() : '';
  if (!signerName) {
    alert('Enter the customer name before saving a proposal response.');
    return;
  }
  const label = nextStatus === 'approved' ? 'Approved' : 'Changes Requested';
  const stamped = [
    '[PORTAL RESPONSE]',
    label + ' by ' + signerName + (signerTitle ? ' (' + signerTitle + ')' : '') + ' on ' + new Date().toLocaleString()
  ];
  if (responseNotes) stamped.push(responseNotes);
  const updatedNotes = proposalBaseNotes(invoice.notes) + '\n\n' + stamped.join('\n');
  statusMsg('Saving proposal response...');
  const { data, error } = await supabaseClient
    .from('invoices')
    .update({ status: nextStatus, notes: updatedNotes })
    .eq('id', invoice.id)
    .select('*')
    .single();
  if (error) {
    statusMsg(error.message);
    return;
  }
  await savePortalEvent(nextStatus, signerName, signerTitle, responseNotes);
  invoice = data;
  await loadPortalEvents();
  statusMsg('Proposal ' + label.toLowerCase() + ' saved.');
  renderPortal();
}

async function resolveLeadId() {
  if (!invoice || currentLeadId) return currentLeadId;
  const { data, error } = await supabaseClient
    .from('crm_leads')
    .select('id, full_name, company')
    .eq('client_id', invoice.client_id || '');
  if (error) return null;
  const target = String(invoice.customer_name || '').trim().toLowerCase();
  const match = (data || []).find(lead => {
    return [lead.full_name, lead.company].some(value => String(value || '').trim().toLowerCase() === target);
  });
  currentLeadId = match ? match.id : null;
  return currentLeadId;
}

async function loadPortalEvents() {
  if (!invoice) {
    portalEvents = [];
    return;
  }
  const leadId = await resolveLeadId();
  let query = supabaseClient
    .from('crm_portal_events')
    .select('*')
    .eq('invoice_id', invoice.id)
    .order('created_at', { ascending: false })
    .limit(10);
  if (leadId) query = query.eq('lead_id', leadId);
  const { data, error } = await query;
  if (error) {
    portalEvents = [];
    return;
  }
  portalEvents = data || [];
}

async function savePortalEvent(nextStatus, signerName, signerTitle, responseNotes) {
  const leadId = await resolveLeadId();
  const { error } = await supabaseClient.from('crm_portal_events').insert({
    lead_id: leadId,
    invoice_id: invoice.id,
    client_id: invoice.client_id || null,
    event_type: nextStatus,
    actor_name: signerName,
    actor_title: signerTitle || null,
    notes: responseNotes || null,
    metadata: {
      document_number: invoice.number || null,
      document_type: portalType(invoice).toLowerCase()
    }
  });
  if (error) {
    statusMsg('Proposal status updated, but portal event log failed: ' + error.message);
  }
}

async function loadPortal() {
  if (!invoiceId) {
    statusMsg('Missing invoice or proposal link.');
    renderPortal();
    return;
  }
  statusMsg('Loading customer portal...');
  const { data, error } = await supabaseClient.from('invoices').select('*').eq('id', invoiceId).maybeSingle();
  if (error) {
    statusMsg(error.message);
    renderPortal();
    return;
  }
  invoice = data || null;
  if (!invoice) {
    statusMsg('Document not found.');
    renderPortal();
    return;
  }
  await resolveLeadId();
  await loadPortalEvents();
  statusMsg(portalType(invoice) + ' ready.');
  renderPortal();
}

loadPortal();
</script>
</body>
</html>
