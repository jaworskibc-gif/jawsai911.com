<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aaron Agent Entry | JAWSAI911</title>
<meta name="description" content="Private Aaron Elrod lead entry page for JAWSAI911.">
<style>
  :root{
    --bg:#05070d;
    --panel:#0b0f18;
    --panel2:#141c2a;
    --line:rgba(59,130,246,.18);
    --blue:#3b82f6;
    --sky:#7dd3fc;
    --amber:#f59e0b;
    --text:#edf2ff;
    --muted:#93a7c6;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    min-height:100vh;
    font-family:Inter,Segoe UI,sans-serif;
    color:var(--text);
    background:
      radial-gradient(circle at 15% 15%, rgba(245,158,11,.14), transparent 28%),
      radial-gradient(circle at 85% 0%, rgba(59,130,246,.2), transparent 32%),
      linear-gradient(180deg, #03050a, #05070d 45%, #0a1220);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .card{
    width:min(100%, 540px);
    background:rgba(11,15,24,.95);
    border:1px solid var(--line);
    border-top:3px solid var(--amber);
    border-radius:18px;
    padding:28px;
    box-shadow:0 24px 90px rgba(0,0,0,.45);
  }
  .eyebrow{
    font-size:12px;
    font-weight:800;
    letter-spacing:2px;
    text-transform:uppercase;
    color:var(--amber);
    margin-bottom:10px;
  }
  h1{
    margin:0 0 10px;
    font-size:clamp(28px,6vw,40px);
    line-height:1;
  }
  p{
    margin:0 0 18px;
    color:var(--muted);
    line-height:1.6;
    font-size:15px;
  }
  .note{
    background:rgba(245,158,11,.1);
    color:#ffe1a6;
    border:1px solid rgba(245,158,11,.28);
    border-radius:12px;
    padding:14px 16px;
    font-size:14px;
    font-weight:700;
    margin-bottom:20px;
  }
  form{display:grid;gap:14px}
  label{
    display:grid;
    gap:8px;
    font-size:13px;
    font-weight:700;
    color:#d9e7ff;
  }
  input{
    width:100%;
    min-height:48px;
    border-radius:12px;
    border:1px solid var(--line);
    background:var(--panel2);
    color:var(--text);
    padding:0 14px;
    font:inherit;
  }
  input:focus{
    outline:none;
    border-color:var(--amber);
    box-shadow:0 0 0 3px rgba(245,158,11,.12);
  }
  button{
    min-height:50px;
    border:none;
    border-radius:12px;
    background:linear-gradient(180deg, #f59e0b, #d97706);
    color:#111827;
    font:inherit;
    font-weight:800;
    letter-spacing:.4px;
    cursor:pointer;
  }
  .status{
    min-height:22px;
    margin-top:10px;
    font-size:14px;
  }
  .status.ok{color:#fde68a}
</style>
</head>
<body>
  <main class="card">
    <div class="eyebrow">Private Agent Entry</div>
    <h1>Aaron Internal Lead Entry</h1>
    <p>Use this private form when Aaron enters a lead himself. The lead is still attributed to Aaron, but no client discount is applied.</p>
    <div class="note">No 10% discount is attached to submissions from this page.</div>
    <form id="lead-form">
      <label>Client name
        <input name="clientName" autocomplete="name" required>
      </label>
      <label>Phone number
        <input name="phone" autocomplete="tel" inputmode="tel" required>
      </label>
      <label>Business name
        <input name="businessName" autocomplete="organization" required>
      </label>
      <label>Email
        <input name="email" type="email" autocomplete="email" required>
      </label>
      <button type="submit">Submit</button>
    </form>
    <div class="status" id="status"></div>
  </main>

  <script src="../referrals.js"></script>
  <script>
    document.getElementById('lead-form').addEventListener('submit', function (event) {
      event.preventDefault();
      const form = event.currentTarget;
      const formData = new FormData(form);
      window.JAWSReferrals.createLead({
        repId: 'aaron',
        sourceType: 'agent',
        discountApplied: false,
        clientName: formData.get('clientName'),
        phone: formData.get('phone'),
        businessName: formData.get('businessName'),
        email: formData.get('email')
      });
      form.reset();
      const status = document.getElementById('status');
      status.className = 'status ok';
      status.textContent = 'Submitted. This lead is counted as self-entered for Aaron with no discount.';
    });
  </script>
</body>
</html>
