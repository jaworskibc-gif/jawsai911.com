<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rivet Fade Co. · 🦈</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0a;--card:#161616;--ink:#f5f0e6;--muted:#8c827f;--gold:#e0bb87;--gold2:#be9c7f;--line:#363837}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;font-family:"DM Sans",system-ui,sans-serif;color:var(--ink);background:var(--bg);display:grid;place-items:center;padding:24px}
.card{width:min(100%,400px);background:var(--card);border:1px solid var(--line);border-radius:22px;padding:36px 28px;text-align:center;box-shadow:0 24px 60px rgba(0,0,0,.5)}
.emoji{font-size:2.6rem;margin-bottom:8px;line-height:1}
.eyebrow{font-size:.7rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin-bottom:10px}
h1{font-family:"Playfair Display",serif;font-size:1.75rem;font-weight:500;margin-bottom:8px}
p{font-size:.9rem;color:var(--muted);line-height:1.55;margin-bottom:22px}
input{width:100%;padding:15px;border-radius:12px;border:1px solid var(--line);background:#000;color:var(--ink);font:inherit;text-align:center;letter-spacing:.35em;font-size:1.15rem;margin-bottom:12px}
input:focus{outline:none;border-color:var(--gold)}
button{width:100%;padding:14px;border:none;border-radius:999px;background:linear-gradient(135deg,var(--gold),var(--gold2));color:#0a0a0a;font-weight:800;cursor:pointer;font-family:inherit;font-size:.9rem}
button:hover{opacity:.92}
.error{display:none;color:#e07a7a;font-size:.8rem;margin-top:12px;font-weight:700}
.back{display:inline-block;margin-top:18px;font-size:.8rem;color:var(--muted);text-decoration:none}
.back:hover{color:var(--gold)}
</style>
</head>
<body>
  <div class="card">
    <div class="emoji">🦈</div>
    <div class="eyebrow">Rivet Fade Co.</div>
    <h1>Operator access</h1>
    <p>Enter the access code to open the back-end stack.</p>
    <form id="loginForm">
      <input id="code" type="password" inputmode="numeric" autocomplete="off" placeholder="•••" autofocus maxlength="8">
      <button type="submit">Enter 🦈</button>
    </form>
    <div class="error" id="err">Incorrect code.</div>
    <a class="back" href="index.html">← Back to site</a>
  </div>
<script>
document.getElementById('loginForm').addEventListener('submit', function (e) {
  e.preventDefault();
  var v = document.getElementById('code').value.trim();
  if (v === '911') {
    sessionStorage.setItem('rivet_staff_auth', '1');
    sessionStorage.setItem('jaw_auth', 'ok');
    location.href = 'command.html';
    return;
  }
  document.getElementById('err').style.display = 'block';
  document.getElementById('code').value = '';
  document.getElementById('code').focus();
});
</script>
</body>
</html>
