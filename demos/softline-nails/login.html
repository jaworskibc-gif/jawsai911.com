<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Softline Studio Staff Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#2D2D2D;
  --paper:#F5F7F8;
  --panel:#FFFFFF;
  --teal:#268ECB;
  --teal-deep:#134A66;
  --line:#E2E6E8;
  --muted:#606262;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  min-height:100vh;font-family:'Inter',Arial,sans-serif;color:var(--ink);
  background:
    radial-gradient(circle at top right, rgba(38,142,203,0.18), transparent 28%),
    radial-gradient(circle at bottom left, rgba(19,74,102,0.12), transparent 30%),
    var(--paper);
  display:grid;place-items:center;padding:24px;
}
.shell{width:min(100%,460px)}
.card{
  background:rgba(255,255,255,0.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,0.75);border-radius:26px;padding:32px;
  box-shadow:0 28px 60px -26px rgba(38,60,80,0.32);
}
.eyebrow{
  font-size:11px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:var(--teal);
  margin-bottom:12px;
}
h1{font-family:'Fraunces',serif;font-size:34px;line-height:1.05;margin-bottom:10px}
p{font-size:14px;color:var(--muted);line-height:1.6}
.form{margin-top:26px;display:grid;gap:14px}
label{font-size:11px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
input{
  width:100%;padding:15px 16px;border-radius:14px;border:1px solid var(--line);background:#fff;
  font:600 15px 'Inter',Arial,sans-serif;color:var(--ink);outline:none;
}
input:focus{border-color:rgba(38,142,203,0.45);box-shadow:0 0 0 4px rgba(38,142,203,0.12)}
button{
  margin-top:8px;border:none;border-radius:999px;background:linear-gradient(135deg,var(--teal),var(--teal-deep));
  color:#fff;padding:14px 18px;font:800 13px 'Inter',Arial,sans-serif;letter-spacing:0.3px;cursor:pointer;
}
.error{display:none;margin-top:12px;font-size:13px;color:#A23535;font-weight:700}
.back{display:inline-flex;align-items:center;gap:8px;margin-top:16px;font-size:12px;font-weight:700;color:var(--muted)}
.back:hover{color:var(--ink)}
</style>
</head>
<body>
  <div class="shell">
    <div class="card">
      <div class="eyebrow">Luxe SuperSite Operator</div>
      <h1>Staff login</h1>
      <p>Private operator access for Command Hub, CRM, Gen-Viral stack, and Google Review Engine.</p>
      <form class="form" id="loginForm">
        <div>
          <label for="staffPassword">Password</label>
          <input id="staffPassword" type="password" autocomplete="current-password" placeholder="Enter staff password">
        </div>
        <button type="submit">Enter Command Hub</button>
      </form>
      <div class="error" id="loginError">Incorrect password.</div>
      <p style="margin-top:14px;font-size:12px;color:#888">Demo password: <b>jaws911</b></p>
      <a class="back" href="index.html">Back to site</a>
    </div>
  </div>
<script>
document.getElementById('loginForm').addEventListener('submit', function (event) {
  event.preventDefault();
  var password = document.getElementById('staffPassword').value.trim();
  if (password === 'jaws911' || password === 'luxe911') {
    sessionStorage.setItem('softline_staff_auth', '1');
    window.location.href = 'command.html';
    return;
  }
  document.getElementById('loginError').style.display = 'block';
});
</script>
</body>
</html>
