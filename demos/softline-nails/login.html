<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Softline Studio · 🦈</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0a;--card:#161616;--ink:#f5f0e6;--muted:#8c827f;--gold:#d4a5a5;--line:#363837}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;font-family:"DM Sans",system-ui,sans-serif;color:var(--ink);background:var(--bg);display:grid;place-items:center;padding:24px}
.card{width:min(100%,420px);background:var(--card);border:1px solid var(--line);border-radius:22px;padding:32px;text-align:center}
.emoji{font-size:2.4rem;margin-bottom:10px}
h1{font-family:"Playfair Display",serif;font-size:1.8rem;font-weight:500;margin-bottom:8px}
p{font-size:.9rem;color:var(--muted);line-height:1.55;margin-bottom:20px}
input{width:100%;padding:14px;border-radius:12px;border:1px solid var(--line);background:#000;color:var(--ink);font:inherit;text-align:center;letter-spacing:.2em;margin-bottom:12px}
button{width:100%;padding:14px;border:none;border-radius:999px;background:linear-gradient(135deg,#f0d4d4,#b88484);color:#0a0a0a;font-weight:800;cursor:pointer;font-family:inherit}
.error{display:none;color:#e07a7a;font-size:.8rem;margin-top:10px;font-weight:700}
.back{display:inline-block;margin-top:16px;font-size:.8rem;color:var(--muted);text-decoration:none}
</style>
</head>
<body>
  <div class="card">
    <div class="emoji">🦈</div>
    <h1>Restricted access</h1>
    <p>Enter code to open the operator stack.</p>
    <form id="loginForm">
      <input id="staffPassword" type="password" inputmode="numeric" autocomplete="off" placeholder="••••" autofocus>
      <button type="submit">Enter 🦈</button>
    </form>
    <div class="error" id="loginError">Incorrect code.</div>
    <a class="back" href="index.html">← Back to site</a>
  </div>
<script>
document.getElementById('loginForm').addEventListener('submit', function (e) {
  e.preventDefault();
  var password = document.getElementById('staffPassword').value.trim();
  if (password === '911') {
    sessionStorage.setItem('softline_staff_auth', '1');
    sessionStorage.setItem('jaw_auth', 'ok');
    window.location.href = 'command.html';
    return;
  }
  document.getElementById('loginError').style.display = 'block';
});
</script>
</body>
</html>
