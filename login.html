<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login - JAWSAI911</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;background:radial-gradient(circle at top,rgba(56,189,248,.16),transparent 28%),#000810;color:#eef2ff;font-family:"Segoe UI",-apple-system,sans-serif;display:flex;align-items:center;justify-content:center;padding:24px}
.card{width:100%;max-width:420px;padding:44px 36px 38px;background:#060a14;border:1px solid rgba(59,130,246,.25);border-top:3px solid #3b82f6;border-radius:14px;box-shadow:0 24px 80px rgba(0,0,0,.4);text-align:center}
.logo{width:min(220px,70vw);display:block;margin:0 auto 22px;mix-blend-mode:screen;filter:brightness(1.08) drop-shadow(0 0 18px rgba(56,189,248,.32))}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:3px;color:#38bdf8;text-transform:uppercase;margin-bottom:8px}
h1{font-size:24px;font-weight:900;color:#fff;margin-bottom:10px}
p{font-size:14px;line-height:1.6;color:#8fa4c7;margin-bottom:22px}
input{width:100%;padding:15px 18px;background:#0a0d14;border:1px solid rgba(59,130,246,.3);border-radius:8px;color:#eef2ff;font-size:18px;font-family:inherit;letter-spacing:4px;text-align:center;outline:none;transition:border-color .2s,box-shadow .2s}
input:focus{border-color:#3b82f6;box-shadow:0 0 0 3px rgba(59,130,246,.12)}
input.error{border-color:#f87171;animation:shake .3s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.err{min-height:18px;margin-top:10px;font-size:12px;color:#f87171}
button{width:100%;margin-top:8px;padding:14px;border:none;border-radius:8px;background:linear-gradient(180deg,#0877ff,#0052dc);color:#fff;font-size:14px;font-weight:800;letter-spacing:1px;text-transform:uppercase;cursor:pointer}
button:hover{opacity:.92}
.back{display:inline-flex;align-items:center;gap:8px;margin-top:18px;font-size:12px;color:#5f769d;text-decoration:none}
.back:hover{color:#38bdf8}
</style>
</head>
<body>
<div class="card">
  <img class="logo" src="jawsai911-logo-dark-hero.jpeg" alt="JAWSAI911">
  <div class="eyebrow">🦈</div>
  <h1>Team Sign In</h1>
  <p>Sign in to the JAWSAI911 Command Hub and CRM.</p>
  <form id="loginForm">
    <label for="email">Email</label>
    <input type="email" id="email" required autocomplete="username" autofocus style="letter-spacing:normal;text-align:left;margin:8px 0 16px">
    <label for="pw">Password</label>
    <input type="password" id="pw" required autocomplete="current-password" style="letter-spacing:normal;text-align:left;margin-top:8px">
    <div class="err" id="err" role="alert" aria-live="polite"></div>
    <button id="signIn" type="submit">Sign In</button>
  </form>
  <a class="back" href="index.html">Back to site</a>
</div>
<script src="/hub-session.js"></script>
<script>
function safeDestination(value) {
  try {
    const url = new URL(value || '/dashboard.html', location.origin);
    if (url.origin === location.origin && url.pathname !== '/login.html') return url.pathname + url.search;
  } catch (_) {}
  return '/dashboard.html';
}
async function tryLogin(event) {
  if (event) event.preventDefault();
  const button = document.getElementById('signIn');
  const message = document.getElementById('err');
  button.disabled = true; message.textContent = '';
  try {
    const client = await window.JAWSHubReady;
    const {data,error} = await client.auth.signInWithPassword({email:document.getElementById('email').value.trim(), password:document.getElementById('pw').value});
    if (error) throw new Error('Unable to sign in. Check your email and password.');
    const member = await client.from('hub_team_members').select('active').eq('user_id',data.user.id).maybeSingle();
    if (member.error || !member.data || !member.data.active) {
      await client.auth.signOut({scope:'local'});
      throw new Error('Your account does not have team access. Contact your administrator.');
    }
    document.getElementById('pw').value = '';
    const destination = safeDestination(sessionStorage.getItem('jaw_return'));
    sessionStorage.removeItem('jaw_return');
    location.replace(destination);
  } catch (error) { message.textContent = error.message; }
  finally { button.disabled = false; }
}
document.getElementById('loginForm').addEventListener('submit',tryLogin);
</script>
</body></html>
