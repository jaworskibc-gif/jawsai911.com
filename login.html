<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login - JAWSAI911</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;background:radial-gradient(circle at top,rgba(56,189,248,.16),transparent 28%),#000810;color:#eef2ff;font-family:"Segoe UI",-apple-system,sans-serif;display:flex;align-items:center;justify-content:center;padding:24px}
.card{width:100%;max-width:420px;padding:44px 36px 38px;background:#060a14;border:1px solid rgba(59,130,246,.25);border-top:3px solid #3b82f6;border-radius:14px;box-shadow:0 24px 80px rgba(0,0,0,.4);text-align:center}
.logo{width:min(220px,70vw);display:block;margin:0 auto 22px;mix-blend-mode:screen;filter:brightness(1.08) drop-shadow(0 0 18px rgba(56,189,248,.32))}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:3px;color:#38bdf8;text-transform:uppercase;margin-bottom:8px}
h1{font-size:24px;font-weight:900;color:#fff;margin-bottom:10px}
p{font-size:14px;line-height:1.6;color:#8fa4c7;margin-bottom:22px}
input{width:100%;padding:15px 18px;background:#0a0d14;border:1px solid rgba(59,130,246,.3);border-radius:8px;color:#eef2ff;font-size:18px;font-family:inherit;letter-spacing:4px;text-align:center;outline:none;transition:border-color .2s,box-shadow .2s}
input:focus{border-color:#3b82f6;box-shadow:0 0 0 3px rgba(59,130,246,.12)}
input.error{border-color:#f87171;animation:shake .3s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.err{min-height:18px;margin-top:10px;font-size:12px;color:#f87171}
button{width:100%;margin-top:8px;padding:14px;border:none;border-radius:8px;background:linear-gradient(180deg,#0877ff,#0052dc);color:#fff;font-size:14px;font-weight:800;letter-spacing:1px;text-transform:uppercase;cursor:pointer}
button:hover{opacity:.92}
.back{display:inline-flex;align-items:center;gap:8px;margin-top:18px;font-size:12px;color:#5f769d;text-decoration:none}
.back:hover{color:#38bdf8}
</style>
</head>
<body>
<div class="card">
  <img class="logo" src="jawsai911-logo-dark-hero.jpeg" alt="JAWSAI911">
  <div class="eyebrow">Command Hub</div>
  <h1>Restricted Access</h1>
  <p>Enter the hub password to open the JAWSAI911 tool stack.</p>
  <input type="password" id="pw" placeholder="........" autofocus autocomplete="current-password">
  <div class="err" id="err"></div>
  <button onclick="tryLogin()">Enter Hub</button>
  <a class="back" href="index.html">Back to site</a>
</div>
<script>
const HASH='f0d1f82a60d8332ecb4e3eaf7b779e94a251ddf2becbbddd240118d853895b35';
async function sha256(str){const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(str));return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('')}
async function tryLogin(){
  const input=document.getElementById('pw');
  const err=document.getElementById('err');
  const hash=await sha256(input.value);
  if(hash===HASH){
    sessionStorage.setItem('jaw_auth','ok');
    const dest=sessionStorage.getItem('jaw_return')||'dashboard.html';
    sessionStorage.removeItem('jaw_return');
    location.href=dest;
    return;
  }
  input.classList.add('error');
  err.textContent='Incorrect password.';
  setTimeout(()=>input.classList.remove('error'),400);
  input.value='';
  input.focus();
}
document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')tryLogin()});
</script>
</body>
</html>
